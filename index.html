<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Run ppu-ocv image operations on your own image in the browser and copy the code that does the same."
    />
    <title>ppu-ocv playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Neutral graphite so the colors of the image under test read true.
         Amber is the only hue in the chrome, like a darkroom safelight. */
      :root {
        color-scheme: dark;
        --bg-deep: #0f0f10;
        --bg: #141415;
        --surface: #19191b;
        --raised: #232325;
        --line: rgba(237, 237, 237, 0.08);
        --line-strong: rgba(237, 237, 237, 0.16);
        --text: #ededed;
        --text-2: #a1a1a6;
        --text-3: #85858b;
        --accent: #e0a243;
        --accent-hover: #e9b25c;
        --accent-ink: #1a1408;
        --positive: #4cc38a;
        --negative: #e5484d;
        --font-sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --fast: 150ms;
        --topbar-h: 56px;
        --sidebar-w: 272px;
        --code-h: 248px;
      }

      body {
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 20px;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button {
        font: inherit;
        color: inherit;
      }

      .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* --- Top bar --- */
      .topbar {
        min-height: var(--topbar-h);
        padding: 0 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        background: var(--bg-deep);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        margin-right: auto;
      }
      .brand-mark {
        width: 18px;
        height: 18px;
        color: var(--text-2);
      }
      .brand-name {
        font-size: 16px;
        font-weight: 500;
      }
      .brand-version {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-3);
      }
      .brand-links {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: 8px;
      }
      .brand-links a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        color: var(--text-3);
        transition: color var(--fast) var(--ease);
      }
      .brand-links .icon {
        width: 18px;
        height: 18px;
      }
      .brand-links .icon-fill {
        fill: currentColor;
        stroke: none;
      }

      /* Fixed width, so a long status or error never moves the buttons */
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 240px;
        min-width: 0;
        font-size: 13px;
        color: var(--text-2);
      }
      .status-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-3);
        flex-shrink: 0;
      }
      .status-dot.ready {
        background: var(--positive);
      }
      .status-dot.loading {
        animation: pulse 1.2s var(--ease) infinite;
      }
      .status-dot.error {
        background: var(--negative);
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 36px;
        padding: 0 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color var(--fast) var(--ease),
          border-color var(--fast) var(--ease),
          color var(--fast) var(--ease),
          transform var(--fast) var(--ease);
      }
      .btn:active:not(:disabled) {
        transform: scale(0.98);
      }

      .btn-secondary {
        border: 1px solid var(--line-strong);
        background: var(--raised);
        color: var(--text);
      }

      /* Fixed width: the label switches between "Process" and "Deskew" */
      .btn-primary {
        width: 112px;
        border: none;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .btn-primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-small {
        min-height: 28px;
        min-width: 80px;
        padding: 0 10px;
        border-radius: 6px;
        font-size: 13px;
      }
      .btn-copy.copied {
        color: var(--positive);
      }

      #file-input {
        display: none;
      }

      /* --- Shell --- */
      .app {
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      }

      /* Desktop: one screen with fixed regions. Nothing inside a region can
         change the size of another, so checking operations, loading an image
         or a long status never moves the layout. */
      @media (min-width: 801px) and (min-height: 560px) {
        body {
          height: 100dvh;
          overflow: hidden;
          display: grid;
          grid-template-rows: auto minmax(0, 1fr);
        }
        .app {
          min-height: 0;
        }
        .sidebar {
          min-height: 0;
        }
        .content {
          min-height: 0;
          grid-template-rows: minmax(0, 1fr) var(--code-h);
        }
      }

      /* --- Sidebar --- */
      .sidebar {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        background: var(--bg-deep);
        border-right: 1px solid var(--line);
      }

      .mode-tabs {
        display: flex;
        gap: 16px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .mode-tab {
        min-height: 40px;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-3);
        cursor: pointer;
        transition:
          color var(--fast) var(--ease),
          border-color var(--fast) var(--ease);
      }
      .mode-tab.active {
        color: var(--text);
        border-bottom-color: var(--text);
      }

      .sidebar-panel {
        min-height: 0;
        overflow-y: auto;
        scrollbar-gutter: stable;
        overscroll-behavior: contain;
        padding: 16px 12px 24px 16px;
      }
      .sidebar-panel.hidden {
        display: none;
      }

      .section-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-2);
        margin-bottom: 4px;
      }

      /* --- Operation rows --- */
      .op-list {
        list-style: none;
      }
      .op + .op {
        border-top: 1px solid var(--line);
      }

      /* Checkbox, then the label with the API call it adds stacked under
         it, so long method names never squeeze the label */
      .op-head {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr);
        column-gap: 10px;
        align-items: center;
        padding: 8px 0;
        cursor: pointer;
        user-select: none;
      }
      .op-label {
        overflow-wrap: anywhere;
        color: var(--text-2);
        transition: color var(--fast) var(--ease);
      }
      .op.active .op-label {
        color: var(--text);
      }
      .op-call {
        grid-column: 2;
        overflow-wrap: anywhere;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 16px;
        color: var(--text-3);
      }

      .checkbox {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        border: 1.5px solid var(--text-3);
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
        transition:
          background-color var(--fast) var(--ease),
          border-color var(--fast) var(--ease);
      }
      .checkbox:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .checkbox:checked::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 1px;
        width: 5px;
        height: 9px;
        border: solid var(--accent-ink);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }

      /* Parameters keep their height whether the operation is on or off,
         so checking a row never moves the rows below it */
      .op-params {
        display: grid;
        gap: 8px;
        padding: 0 0 12px 26px;
      }

      .param {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 8px;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 16px;
      }
      .param-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text-3);
      }
      .param-value {
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      .param-hint {
        grid-column: 1 / -1;
        margin-top: 4px;
        font-family: var(--font-sans);
        font-size: 12px;
        color: var(--text-3);
      }

      .param-select {
        min-height: 28px;
        padding: 0 8px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: var(--raised);
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 12px;
        cursor: pointer;
      }

      .slider {
        grid-column: 1 / -1;
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 20px;
        background: transparent;
        cursor: pointer;
      }
      .slider::-webkit-slider-runnable-track {
        height: 2px;
        border-radius: 1px;
        background: var(--line-strong);
      }
      .slider::-moz-range-track {
        height: 2px;
        border-radius: 1px;
        background: var(--line-strong);
      }
      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        margin-top: -5px;
        border-radius: 50%;
        border: none;
        background: var(--text-2);
      }
      .slider::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: none;
        background: var(--text-2);
      }
      .op.active .slider::-webkit-slider-thumb,
      .field .slider::-webkit-slider-thumb {
        background: var(--accent);
      }
      .op.active .slider::-moz-range-thumb,
      .field .slider::-moz-range-thumb {
        background: var(--accent);
      }

      /* --- Deskew panel --- */
      .fields {
        display: grid;
        margin-top: 4px;
      }
      .field {
        padding: 12px 0;
      }
      .field + .field {
        border-top: 1px solid var(--line);
      }

      .toggle-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .toggle-text {
        flex: 1;
        min-width: 0;
      }
      .toggle-desc {
        font-size: 12px;
        line-height: 16px;
        color: var(--text-3);
        margin-top: 2px;
      }

      .toggle {
        position: relative;
        width: 32px;
        height: 20px;
        flex-shrink: 0;
      }
      .toggle input {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        cursor: pointer;
      }
      .toggle-track {
        position: absolute;
        inset: 0;
        border-radius: 10px;
        background: var(--raised);
        border: 1px solid var(--line-strong);
        pointer-events: none;
        transition:
          background-color var(--fast) var(--ease),
          border-color var(--fast) var(--ease);
      }
      .toggle-track::before {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        left: 2px;
        top: 2px;
        border-radius: 50%;
        background: var(--text-2);
        transition:
          transform var(--fast) var(--ease),
          background-color var(--fast) var(--ease);
      }
      .toggle input:checked + .toggle-track {
        background: var(--accent);
        border-color: var(--accent);
      }
      .toggle input:checked + .toggle-track::before {
        transform: translateX(12px);
        background: var(--accent-ink);
      }
      .toggle input:focus-visible + .toggle-track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .deskew-result {
        display: none;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .deskew-result.visible {
        display: block;
      }
      .deskew-result-label {
        font-size: 13px;
        color: var(--text-2);
      }
      .deskew-result-value {
        margin-top: 4px;
        font-family: var(--font-mono);
        font-size: 28px;
        line-height: 32px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }
      .deskew-result-sub {
        margin-top: 4px;
        font-size: 13px;
        color: var(--text-3);
      }

      /* --- Content --- */
      .content {
        display: grid;
      }

      .canvas-area {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        min-height: 0;
      }
      .canvas-panel {
        display: grid;
        grid-template-rows: 40px minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
      }
      .canvas-panel + .canvas-panel {
        border-left: 1px solid var(--line);
      }

      .panel-head {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .panel-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-2);
      }
      .panel-meta {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        flex: 1;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      .panel-meta > * {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta-skew {
        color: var(--accent);
      }

      /* The canvas is sized by the stage, not by the image, so a large or
         rotated result never resizes the panel */
      .stage {
        position: relative;
        min-height: 0;
        background: var(--bg);
      }
      .stage canvas {
        position: absolute;
        inset: 16px;
        width: calc(100% - 32px);
        height: calc(100% - 32px);
        object-fit: contain;
      }
      .placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        font-size: 13px;
        color: var(--text-3);
      }

      /* --- Code panel --- */
      .code-section {
        display: grid;
        grid-template-rows: 40px minmax(0, 1fr);
        min-height: 0;
        background: var(--surface);
        border-top: 1px solid var(--line);
      }
      .code-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 8px 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .code-title {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-2);
      }

      .code-block {
        min-height: 0;
        overflow: auto;
        scrollbar-gutter: stable;
        overscroll-behavior: contain;
        padding: 12px 16px;
        font-family: var(--font-mono);
        font-size: 13px;
        line-height: 20px;
        color: #d4d4d8;
        white-space: pre;
      }
      .code-block .kw {
        color: var(--text-3);
      }
      .code-block .fn {
        color: #e8c27a;
      }
      .code-block .str {
        color: #a8c48f;
      }
      .code-block .num {
        color: #8fb8d6;
      }
      .code-block .cm {
        color: var(--text-3);
      }
      .code-raw {
        position: absolute;
        left: -9999px;
      }

      /* --- Drop overlay --- */
      .dropzone-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(15, 15, 16, 0.8);
        pointer-events: none;
      }
      .dropzone-overlay::before {
        content: "";
        position: absolute;
        inset: 16px;
        border: 1.5px dashed var(--accent);
        border-radius: 16px;
      }
      .dropzone-overlay.visible {
        display: flex;
      }
      .dropzone-overlay-text {
        padding: 12px 20px;
        border-radius: 10px;
        background: var(--surface);
        font-size: 15px;
        color: var(--text);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fadeIn 300ms var(--ease) both;
      }

      @media (hover: hover) {
        .brand-links a:hover {
          color: var(--text);
        }
        .btn-secondary:hover {
          border-color: rgba(237, 237, 237, 0.24);
          background: #2a2a2d;
        }
        .btn-primary:hover:not(:disabled) {
          background: var(--accent-hover);
        }
        .mode-tab:hover {
          color: var(--text-2);
        }
        .mode-tab.active:hover {
          color: var(--text);
        }
      }

      /* iOS Safari zooms on focus below 16px */
      @media (pointer: coarse) {
        .param-select {
          font-size: 16px;
        }
      }

      /* --- Narrow screens: one column that scrolls --- */
      @media (max-width: 800px) {
        .topbar {
          padding: 8px 16px;
        }
        .status {
          order: 3;
          width: 100%;
        }
        .actions {
          flex: 1 1 auto;
          justify-content: flex-end;
        }
        .app {
          grid-template-columns: minmax(0, 1fr);
        }
        .sidebar {
          max-height: 50vh;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }
        .stage {
          height: 320px;
        }
        .code-section {
          grid-template-rows: 40px auto;
        }
        .code-block {
          max-height: 360px;
        }
      }

      @media (max-width: 600px) {
        .canvas-area {
          grid-template-columns: minmax(0, 1fr);
        }
        .canvas-panel + .canvas-panel {
          border-left: none;
          border-top: 1px solid var(--line);
        }
      }

      @media (min-width: 801px) and (max-height: 559px) {
        .stage {
          height: 320px;
        }
        .sidebar-panel {
          max-height: 640px;
        }
        .code-block {
          max-height: 360px;
        }
      }
    </style>
  </head>
  <body>
    <div class="dropzone-overlay" id="drop-overlay">
      <div class="dropzone-overlay-text">Drop an image to load it</div>
    </div>

    <header class="topbar">
      <div class="brand">
        <svg class="icon brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2" />
          <line x1="12" y1="22" x2="12" y2="15.5" />
          <polyline points="22 8.5 12 15.5 2 8.5" />
        </svg>
        <span class="brand-name">ppu-ocv</span>
        <span class="brand-version">v4.0.1</span>
        <nav class="brand-links">
          <a
            href="https://github.com/PT-Perkasa-Pilar-Utama/ppu-ocv"
            target="_blank"
            rel="noopener noreferrer"
            title="GitHub"
            aria-label="ppu-ocv on GitHub"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
              />
            </svg>
          </a>
          <a
            href="https://www.npmjs.com/package/ppu-ocv"
            target="_blank"
            rel="noopener noreferrer"
            title="npm"
            aria-label="ppu-ocv on npm"
          >
            <svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M0 7.334v8h6.666v1.332H12v-1.332h12v-8H0zm6.666 6.664H3.334v-4h3.332v4zm4 1.336H8V8.668h2.666v6.666zm10.666-1.336H14.666v-4h2.666v4h1.334v-4h2.666v4z"
              />
            </svg>
          </a>
        </nav>
      </div>

      <div class="status" role="status">
        <span class="status-dot loading" id="status-dot"></span>
        <span class="status-text" id="status-text">Loading OpenCV…</span>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" id="btn-upload" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          Upload image
        </button>
        <input type="file" id="file-input" accept="image/*" />
        <button class="btn btn-primary" id="btn-process" type="button" disabled>Process</button>
      </div>
    </header>

    <div class="app">
      <aside class="sidebar">
        <div class="mode-tabs" role="tablist">
          <button
            class="mode-tab active"
            id="tab-pipeline"
            type="button"
            role="tab"
            aria-selected="true"
          >
            Pipeline
          </button>
          <button class="mode-tab" id="tab-deskew" type="button" role="tab" aria-selected="false">
            Deskew
          </button>
        </div>

        <div class="sidebar-panel" id="panel-pipeline">
          <h2 class="section-title">Operations</h2>
          <!-- Rows are rendered from OPERATIONS in the script below -->
          <ul class="op-list" id="op-list"></ul>
        </div>

        <div class="sidebar-panel hidden" id="panel-deskew">
          <h2 class="section-title">Options</h2>
          <div class="fields">
            <div class="field">
              <label class="param" for="deskew-area">
                <span class="param-name">minimumAreaThreshold</span>
                <output class="param-value" id="deskew-area-val">20</output>
                <input
                  class="slider"
                  type="range"
                  id="deskew-area"
                  min="5"
                  max="200"
                  step="5"
                  value="20"
                />
                <span class="param-hint">Minimum contour area in pixels for a text region</span>
              </label>
            </div>

            <div class="field">
              <div class="toggle-row">
                <div class="toggle-text">
                  <div id="deskew-verbose-label">Verbose</div>
                  <div class="toggle-desc">Logs each analysis step to the console</div>
                </div>
                <span class="toggle">
                  <input
                    type="checkbox"
                    id="deskew-verbose"
                    aria-labelledby="deskew-verbose-label"
                  />
                  <span class="toggle-track"></span>
                </span>
              </div>
            </div>

            <div class="deskew-result" id="deskew-result-info">
              <div class="deskew-result-label">Detected skew</div>
              <div class="deskew-result-value" id="deskew-angle-value">—</div>
              <div class="deskew-result-sub" id="deskew-angle-sub"></div>
            </div>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="canvas-area">
          <section class="canvas-panel" id="original-panel">
            <div class="panel-head">
              <h2 class="panel-title">Original</h2>
              <div class="panel-meta">
                <span id="file-name"></span>
              </div>
            </div>
            <div class="stage">
              <p class="placeholder" id="original-placeholder">Upload or drop an image</p>
              <canvas id="original-canvas" style="display: none"></canvas>
            </div>
          </section>
          <section class="canvas-panel" id="result-panel">
            <div class="panel-head">
              <h2 class="panel-title" id="result-label">Processed</h2>
              <div class="panel-meta">
                <span class="meta-skew" id="angle-badge" style="display: none"></span>
                <span id="timing-badge" style="display: none"></span>
              </div>
            </div>
            <div class="stage">
              <p class="placeholder" id="result-placeholder">The result appears here after a run</p>
              <canvas id="result-canvas" style="display: none"></canvas>
            </div>
          </section>
        </div>

        <section class="code-section">
          <div class="code-header">
            <h2 class="code-title">Code</h2>
            <button class="btn btn-secondary btn-small btn-copy" id="btn-copy" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
              <span id="copy-label">Copy</span>
            </button>
          </div>
          <pre class="code-block" id="code-preview"></pre>
          <textarea class="code-raw" id="code-raw" aria-hidden="true" tabindex="-1"></textarea>
        </section>
      </main>
    </div>

    <script type="module">
      // -- Operations --
      // One entry per pipeline operation. To add an operation to the
      // playground, add an entry here: the sidebar row, its parameters, the
      // run, and the generated code all read from this table. Entries run in
      // table order.

      /**
       * @typedef {{ kind: "range", key: string, label?: string, min: number, max: number, step: number, value: number }} RangeParam
       * @typedef {{ kind: "select", key: string, options: string[], value: string }} SelectParam
       * @typedef {RangeParam | SelectParam} Param
       * @typedef {Record<string, number | string>} ParamValues
       * @typedef {(processor: { width: number, height: number }) => object} SizedOpts
       *   Options that depend on the image size at that point in the pipeline.
       * @typedef {{
       *   method: string,
       *   label: string,
       *   checked?: boolean,
       *   params?: Param[],
       *   opts?: (v: ParamValues) => object | SizedOpts,
       *   previewArgs?: (v: ParamValues) => string,
       * }} Operation
       *   method is the ImageProcessor method name. previewArgs is the code
       *   shown for options that opts computes at run time.
       */

      /** @type {(key: string, min: number, max: number, step: number, value: number, label?: string) => RangeParam} */
      const range = (key, min, max, step, value, label) => ({
        kind: "range",
        key,
        label,
        min,
        max,
        step,
        value,
      });

      /** @type {Operation[]} */
      const OPERATIONS = [
        { method: "grayscale", label: "Grayscale", checked: true },
        {
          method: "blur",
          label: "Gaussian blur",
          checked: true,
          params: [range("size", 1, 31, 2, 5)],
          opts: (v) => ({ size: [v.size, v.size] }),
        },
        {
          method: "equalize",
          label: "Equalize",
          params: [
            { kind: "select", key: "method", options: ["clahe", "global"], value: "clahe" },
            range("clipLimit", 1, 8, 0.5, 2),
            range("tileGridSize", 2, 32, 2, 8),
          ],
          opts: (v) => ({ method: v.method, clipLimit: v.clipLimit, tileGridSize: v.tileGridSize }),
        },
        { method: "threshold", label: "Threshold", checked: true },
        {
          method: "adaptiveThreshold",
          label: "Adaptive threshold",
          params: [range("size", 3, 51, 2, 7)],
          opts: (v) => ({ size: v.size }),
        },
        { method: "invert", label: "Invert" },
        { method: "canny", label: "Canny edge" },
        {
          method: "dilate",
          label: "Dilate",
          params: [range("size", 1, 21, 2, 3)],
          opts: (v) => ({ size: [v.size, v.size] }),
        },
        { method: "erode", label: "Erode" },
        {
          method: "morphologicalGradient",
          label: "Morphological gradient",
          params: [range("size", 1, 21, 2, 3)],
          opts: (v) => ({ size: [v.size, v.size] }),
        },
        {
          method: "resize",
          label: "Resize",
          params: [range("scale", 10, 200, 10, 50, "scale (%)")],
          opts: (v) => {
            const scale = v.scale / 100;
            return (processor) => ({
              width: Math.max(1, Math.round(processor.width * scale)),
              height: Math.max(1, Math.round(processor.height * scale)),
            });
          },
          previewArgs: (v) => {
            const scale = v.scale / 100;
            return `{ width: Math.round(processor.width * ${scale}), height: Math.round(processor.height * ${scale}) }`;
          },
        },
        {
          method: "border",
          label: "Border",
          params: [range("size", 1, 100, 1, 10)],
          opts: (v) => ({ size: v.size }),
        },
        {
          method: "rotate",
          label: "Rotate",
          params: [range("angle", -180, 180, 1, 10)],
          opts: (v) => ({ angle: v.angle }),
        },
      ];

      const paramId = (op, param) => `${op.method}-${param.key}`;

      function renderParam(op, param) {
        const id = paramId(op, param);
        if (param.kind === "select") {
          const options = param.options
            .map((o) => `<option value="${o}"${o === param.value ? " selected" : ""}>${o}</option>`)
            .join("");
          return `<label class="param" for="${id}"><span class="param-name">${param.key}</span><select class="param-select" id="${id}">${options}</select></label>`;
        }
        return `<label class="param" for="${id}">
          <span class="param-name">${param.label ?? param.key}</span>
          <output class="param-value" id="${id}-val">${param.value}</output>
          <input class="slider" type="range" id="${id}" min="${param.min}" max="${param.max}" step="${param.step}" value="${param.value}" />
        </label>`;
      }

      function renderOperation(op) {
        const params = op.params
          ? `<div class="op-params">${op.params.map((p) => renderParam(op, p)).join("")}</div>`
          : "";
        return `<li class="op${op.checked ? " active" : ""}">
          <label class="op-head">
            <input class="checkbox" type="checkbox" id="op-${op.method}"${op.checked ? " checked" : ""} />
            <span class="op-label">${op.label}</span>
            <code class="op-call">${op.method}()</code>
          </label>
          ${params}
        </li>`;
      }

      const opList = document.getElementById("op-list");
      opList.innerHTML = OPERATIONS.map(renderOperation).join("");

      /** @returns {ParamValues} */
      function readParams(op) {
        const values = {};
        for (const param of op.params ?? []) {
          const el = document.getElementById(paramId(op, param));
          values[param.key] = param.kind === "range" ? Number(el.value) : el.value;
        }
        return values;
      }

      let ImageProcessor, CanvasProcessor, DeskewService, cv;
      try {
        // Try local build first (for development)
        const local = await import("./lib/index.web.js");
        ImageProcessor = local.ImageProcessor;
        CanvasProcessor = local.CanvasProcessor;
        DeskewService = local.DeskewService;
        cv = local.cv;
      } catch (e) {
        // Fallback to npm CDN if local build is missing or deployed to GH Pages
        console.log("Local build not found, falling back to CDN...");
        const cdn = await import("https://cdn.jsdelivr.net/npm/ppu-ocv@4.0.1/index.web.js");
        ImageProcessor = cdn.ImageProcessor;
        CanvasProcessor = cdn.CanvasProcessor;
        DeskewService = cdn.DeskewService;
        cv = cdn.cv;
      }

      // -- DOM refs --
      const btnUpload = document.getElementById("btn-upload");
      const fileInput = document.getElementById("file-input");
      const fileNameEl = document.getElementById("file-name");
      const btnProcess = document.getElementById("btn-process");
      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const originalCanvas = document.getElementById("original-canvas");
      const resultCanvas = document.getElementById("result-canvas");
      const origPlaceholder = document.getElementById("original-placeholder");
      const resultPlaceholder = document.getElementById("result-placeholder");
      const resultLabel = document.getElementById("result-label");
      const codePreview = document.getElementById("code-preview");
      const codeRaw = document.getElementById("code-raw");
      const timingBadge = document.getElementById("timing-badge");
      const angleBadge = document.getElementById("angle-badge");
      const dropOverlay = document.getElementById("drop-overlay");
      const btnCopy = document.getElementById("btn-copy");
      const copyLabel = document.getElementById("copy-label");
      const tabPipeline = document.getElementById("tab-pipeline");
      const tabDeskew = document.getElementById("tab-deskew");
      const panelPipeline = document.getElementById("panel-pipeline");
      const panelDeskew = document.getElementById("panel-deskew");
      const deskewAreaSlider = document.getElementById("deskew-area");
      const deskewAreaValEl = document.getElementById("deskew-area-val");
      const deskewVerbose = document.getElementById("deskew-verbose");
      const deskewResultInfo = document.getElementById("deskew-result-info");
      const deskewAngleValue = document.getElementById("deskew-angle-value");
      const deskewAngleSub = document.getElementById("deskew-angle-sub");

      let loadedImage = null;
      let currentMode = "pipeline"; // 'pipeline' | 'deskew'

      // -- Init OpenCV --
      // The ppu-ocv/web build does not bundle OpenCV (it is loaded at runtime so
      // bundler-less and CSP-restricted consumers can opt out). Load the
      // OpenCV 5 build that ppu-ocv 4 is built against: it sets globalThis.cv
      // to a Promise of the module, and initRuntime() awaits it.
      try {
        setStatus("loading", "Loading OpenCV…");
        await new Promise((resolve, reject) => {
          if (globalThis.cv) {
            resolve(); // already loaded (e.g. hot-reload)
            return;
          }
          const s = document.createElement("script");
          s.async = true;
          s.src =
            "https://cdn.jsdelivr.net/npm/@techstark/opencv-js@5.0.0-release.1/dist/opencv.js";
          s.onload = resolve;
          s.onerror = () => reject(new Error("Failed to load opencv.js from CDN"));
          document.head.appendChild(s);
        });
        await ImageProcessor.initRuntime();
        setStatus("ready", "Ready");
      } catch (err) {
        setStatus("error", "OpenCV failed");
        console.error(err);
      }

      function setStatus(state, text) {
        statusDot.className = "status-dot " + state;
        statusText.textContent = text;
      }

      // -- Mode tabs --
      tabPipeline.addEventListener("click", () => setMode("pipeline"));
      tabDeskew.addEventListener("click", () => setMode("deskew"));

      function setMode(mode) {
        currentMode = mode;
        tabPipeline.classList.toggle("active", mode === "pipeline");
        tabDeskew.classList.toggle("active", mode === "deskew");
        tabPipeline.setAttribute("aria-selected", String(mode === "pipeline"));
        tabDeskew.setAttribute("aria-selected", String(mode === "deskew"));
        panelPipeline.classList.toggle("hidden", mode !== "pipeline");
        panelDeskew.classList.toggle("hidden", mode !== "deskew");
        btnProcess.textContent = mode === "deskew" ? "Deskew" : "Process";
        resultLabel.textContent = mode === "deskew" ? "Deskewed" : "Processed";
        angleBadge.style.display = "none";
        timingBadge.style.display = "none";
        updateCodePreview();
      }

      // -- Upload --
      btnUpload.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) handleFile(e.target.files[0]);
      });

      // -- Full-page drag & drop --
      let dragCounter = 0;
      document.addEventListener("dragenter", (e) => {
        e.preventDefault();
        dragCounter++;
        dropOverlay.classList.add("visible");
      });
      document.addEventListener("dragleave", (e) => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter <= 0) {
          dragCounter = 0;
          dropOverlay.classList.remove("visible");
        }
      });
      document.addEventListener("dragover", (e) => e.preventDefault());
      document.addEventListener("drop", (e) => {
        e.preventDefault();
        dragCounter = 0;
        dropOverlay.classList.remove("visible");
        if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
      });

      async function handleFile(file) {
        if (!file.type.startsWith("image/")) {
          setStatus("error", "Invalid file");
          return;
        }
        setStatus("loading", "Loading image…");

        const arrayBuffer = await file.arrayBuffer();
        const blob = new Blob([arrayBuffer], { type: file.type });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          originalCanvas.width = img.width;
          originalCanvas.height = img.height;
          originalCanvas.getContext("2d").drawImage(img, 0, 0);
          originalCanvas.style.display = "block";
          origPlaceholder.style.display = "none";
          URL.revokeObjectURL(url);
          btnProcess.disabled = false;
          deskewResultInfo.classList.remove("visible");
          angleBadge.style.display = "none";
          timingBadge.style.display = "none";
          resultCanvas.style.display = "none";
          resultPlaceholder.style.display = "";
          fileNameEl.textContent = `${file.name} · ${img.width}×${img.height}`;
          setStatus("ready", "Ready");
        };
        img.src = url;
      }

      // -- Parameters and checkboxes --
      opList.addEventListener("input", (e) => {
        if (e.target.type !== "range") return;
        document.getElementById(`${e.target.id}-val`).textContent = e.target.value;
        updateCodePreview();
      });
      opList.addEventListener("change", (e) => {
        if (e.target.type === "checkbox") {
          e.target.closest(".op").classList.toggle("active", e.target.checked);
        }
        updateCodePreview();
      });
      deskewAreaSlider.addEventListener("input", () => {
        deskewAreaValEl.textContent = deskewAreaSlider.value;
        updateCodePreview();
      });
      deskewVerbose.addEventListener("change", () => updateCodePreview());

      // -- Pipeline steps --
      // A step's opts is an object, or a function of the processor for
      // options that depend on the image size at that point in the pipeline.
      // previewArgs is then the code shown for those options.
      function getActiveSteps() {
        return OPERATIONS.filter((op) => document.getElementById(`op-${op.method}`).checked).map(
          (op) => {
            const values = readParams(op);
            return {
              name: op.method,
              opts: op.opts?.(values),
              previewArgs: op.previewArgs?.(values),
            };
          }
        );
      }

      // -- Code preview --
      function updateCodePreview() {
        if (currentMode === "deskew") {
          updateDeskewCodePreview();
        } else {
          updatePipelineCodePreview();
        }
      }

      function updatePipelineCodePreview() {
        const steps = getActiveSteps();
        let raw = `import { CanvasProcessor, ImageProcessor } from "ppu-ocv/web";\n\n`;
        raw += `await ImageProcessor.initRuntime();\n`;
        raw += `const canvas = await CanvasProcessor.prepareCanvas(buffer);\n\n`;
        raw += `const processor = new ImageProcessor(canvas);\n`;

        let html = `<span class="kw">import</span> { CanvasProcessor, ImageProcessor } <span class="kw">from</span> <span class="str">"ppu-ocv/web"</span>;\n\n`;
        html += `<span class="kw">await</span> ImageProcessor.<span class="fn">initRuntime</span>();\n`;
        html += `<span class="kw">const</span> canvas = <span class="kw">await</span> CanvasProcessor.<span class="fn">prepareCanvas</span>(buffer);\n\n`;
        html += `<span class="kw">const</span> processor = <span class="kw">new</span> <span class="fn">ImageProcessor</span>(canvas);\n`;

        if (steps.length === 0) {
          raw += `// No operations selected\n`;
          html += `<span class="cm">// No operations selected</span>\n`;
        } else {
          for (const s of steps) {
            if (s.opts) {
              const optsStr = s.previewArgs ?? JSON.stringify(s.opts);
              raw += `processor.${s.name}(${optsStr});\n`;
              const htmlOpts = optsStr
                .replace(/"([^"]+)":/g, '<span class="str">$1</span>: ')
                .replace(/(\d+)/g, '<span class="num">$1</span>');
              html += `processor.<span class="fn">${s.name}</span>(${htmlOpts});\n`;
            } else {
              raw += `processor.${s.name}();\n`;
              html += `processor.<span class="fn">${s.name}</span>();\n`;
            }
          }
        }

        raw += `\nconst result = processor.toCanvas();\nprocessor.destroy();`;
        html += `\n<span class="kw">const</span> result = processor.<span class="fn">toCanvas</span>();\nprocessor.<span class="fn">destroy</span>();`;

        codePreview.innerHTML = html;
        codeRaw.value = raw;
      }

      function updateDeskewCodePreview() {
        const area = deskewAreaSlider.value;
        const verbose = deskewVerbose.checked;

        const optsObj = {
          minimumAreaThreshold: parseInt(area),
          ...(verbose ? { verbose: true } : {}),
        };
        const optsStr = JSON.stringify(optsObj, null, 2);

        let raw = `import { CanvasProcessor, DeskewService, ImageProcessor } from "ppu-ocv/web";\n\n`;
        raw += `await ImageProcessor.initRuntime();\n`;
        raw += `const canvas = await CanvasProcessor.prepareCanvas(buffer);\n\n`;
        raw += `const service = new DeskewService(${optsStr});\n\n`;
        raw += `// Detect skew angle only\n`;
        raw += `const angle = await service.calculateSkewAngle(canvas);\n\n`;
        raw += `// Or deskew the image directly\n`;
        raw += `const deskewed = await service.deskewImage(canvas);`;

        const htmlOpts = optsStr
          .replace(/("minimumAreaThreshold"|"verbose")/g, '<span class="str">$1</span>')
          .replace(/:\s*(\d+)/g, ': <span class="num">$1</span>')
          .replace(/:\s*(true|false)/g, ': <span class="kw">$1</span>');

        let html = `<span class="kw">import</span> { CanvasProcessor, DeskewService, ImageProcessor } <span class="kw">from</span> <span class="str">"ppu-ocv/web"</span>;\n\n`;
        html += `<span class="kw">await</span> ImageProcessor.<span class="fn">initRuntime</span>();\n`;
        html += `<span class="kw">const</span> canvas = <span class="kw">await</span> CanvasProcessor.<span class="fn">prepareCanvas</span>(buffer);\n\n`;
        html += `<span class="kw">const</span> service = <span class="kw">new</span> <span class="fn">DeskewService</span>(${htmlOpts});\n\n`;
        html += `<span class="cm">// Detect skew angle only</span>\n`;
        html += `<span class="kw">const</span> angle = <span class="kw">await</span> service.<span class="fn">calculateSkewAngle</span>(canvas);\n\n`;
        html += `<span class="cm">// Or deskew the image directly</span>\n`;
        html += `<span class="kw">const</span> deskewed = <span class="kw">await</span> service.<span class="fn">deskewImage</span>(canvas);`;

        codePreview.innerHTML = html;
        codeRaw.value = raw;
      }

      // -- Copy --
      btnCopy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(codeRaw.value);
          copyLabel.textContent = "Copied";
          btnCopy.classList.add("copied");
          setTimeout(() => {
            copyLabel.textContent = "Copy";
            btnCopy.classList.remove("copied");
          }, 1500);
        } catch {
          codeRaw.select();
          document.execCommand("copy");
          copyLabel.textContent = "Copied";
          setTimeout(() => {
            copyLabel.textContent = "Copy";
          }, 1500);
        }
      });

      // Restart the entrance animation on every new result
      function replayFadeIn(el) {
        el.classList.remove("fade-in");
        void el.offsetWidth;
        el.classList.add("fade-in");
      }

      // -- Process --
      btnProcess.addEventListener("click", async () => {
        if (!loadedImage) return;
        if (currentMode === "deskew") {
          await runDeskew();
        } else {
          await runPipeline();
        }
      });

      async function runPipeline() {
        const steps = getActiveSteps();
        if (steps.length === 0) {
          setStatus("error", "Select an operation");
          return;
        }

        btnProcess.disabled = true;
        setStatus("loading", "Processing…");
        await new Promise((r) => requestAnimationFrame(r));

        try {
          const t0 = performance.now();
          const srcCanvas = document.createElement("canvas");
          srcCanvas.width = loadedImage.width;
          srcCanvas.height = loadedImage.height;
          srcCanvas.getContext("2d").drawImage(loadedImage, 0, 0);

          const processor = new ImageProcessor(srcCanvas);
          for (const step of steps) {
            const opts = typeof step.opts === "function" ? step.opts(processor) : step.opts;
            processor.execute(step.name, opts);
          }
          const output = processor.toCanvas();
          const elapsed = (performance.now() - t0).toFixed(1);

          resultCanvas.width = output.width;
          resultCanvas.height = output.height;
          resultCanvas.getContext("2d").drawImage(output, 0, 0);
          resultCanvas.style.display = "block";
          resultPlaceholder.style.display = "none";
          replayFadeIn(resultCanvas);

          angleBadge.style.display = "none";
          timingBadge.textContent = `${resultCanvas.width}×${resultCanvas.height} · ${elapsed} ms`;
          timingBadge.style.display = "block";

          processor.destroy();
          setStatus("ready", `Done in ${elapsed} ms`);
        } catch (err) {
          console.error(err);
          setStatus("error", err.message);
        } finally {
          btnProcess.disabled = false;
        }
      }

      async function runDeskew() {
        btnProcess.disabled = true;
        setStatus("loading", "Analysing skew…");
        await new Promise((r) => requestAnimationFrame(r));

        try {
          const t0 = performance.now();

          // Build source canvas from the loaded image
          const srcCanvas = document.createElement("canvas");
          srcCanvas.width = loadedImage.width;
          srcCanvas.height = loadedImage.height;
          srcCanvas.getContext("2d").drawImage(loadedImage, 0, 0);

          const service = new DeskewService({
            minimumAreaThreshold: parseInt(deskewAreaSlider.value),
            verbose: deskewVerbose.checked,
          });

          const angle = await service.calculateSkewAngle(srcCanvas);
          const deskewed = await service.deskewImage(srcCanvas);
          const elapsed = (performance.now() - t0).toFixed(1);

          // Show deskewed result
          resultCanvas.width = deskewed.width;
          resultCanvas.height = deskewed.height;
          resultCanvas.getContext("2d").drawImage(deskewed, 0, 0);
          resultCanvas.style.display = "block";
          resultPlaceholder.style.display = "none";
          replayFadeIn(resultCanvas);

          // Skew angle in the result header
          const sign = angle > 0 ? "+" : "";
          angleBadge.textContent = `Skew ${sign}${angle.toFixed(2)}°`;
          angleBadge.style.display = "block";

          timingBadge.textContent = `${resultCanvas.width}×${resultCanvas.height} · ${elapsed} ms`;
          timingBadge.style.display = "block";

          // Sidebar result info
          deskewAngleValue.textContent = `${sign}${angle.toFixed(2)}°`;
          deskewAngleSub.textContent =
            angle === 0
              ? "No skew detected"
              : `Rotated by ${sign}${(-angle).toFixed(2)}° to correct`;
          deskewResultInfo.classList.add("visible");

          setStatus("ready", `Deskewed in ${elapsed} ms`);
        } catch (err) {
          console.error(err);
          setStatus("error", err.message);
        } finally {
          btnProcess.disabled = false;
        }
      }

      updateCodePreview();
    </script>
  </body>
</html>
