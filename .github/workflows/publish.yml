# .github/workflows/publish.yml

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js for npm auth
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install

      - name: Formatter check
        run: bun run fmt

      - name: Linting check
        run: bun run lint --format=github

      - name: TypeScript type check
        run: bun run type-check

      - name: Run tests
        run: bun run test --coverage

      - name: Publish package to jsr
        run: bunx jsr publish --allow-slow-types

      - name: Build
        run: bun run build

      # Writes README + a sanitized package.json (no scripts/devDependencies)
      # into lib/ so the published package can run no install lifecycle code.
      - name: Prepare publish manifest
        run: bun task prepare-publish

      # --provenance generates a signed SLSA attestation linking the tarball to
      # this commit + workflow run; requires the id-token: write permission above.
      - name: Publish to npm
        run: npm publish ./lib --access=public --provenance
