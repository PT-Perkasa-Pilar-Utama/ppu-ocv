# .github/workflows/publish.yml

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM to the GitHub release
      id-token: write # npm provenance + jsr OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js for npm auth
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install

      # Block the release on any High/Critical advisory in a dependency
      # (VM-05.02). Mirrors the SCA gate that runs on every PR in ci.yml.
      - name: SCA scan (block on vulnerable dependencies)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=./bun.lock

      - name: Formatter check
        run: bun run fmt

      - name: Linting check
        run: bun run lint --format=github

      - name: TypeScript type check
        run: bun run type-check

      - name: Run tests
        run: bun run test --coverage

      - name: Publish package to jsr
        run: bunx jsr publish --allow-slow-types

      - name: Build
        run: bun run build

      # Writes README + a sanitized package.json (no scripts/devDependencies)
      # into lib/ so the published package can run no install lifecycle code.
      - name: Prepare publish manifest
        run: bun task prepare-publish

      # --provenance generates a signed SLSA attestation linking the tarball to
      # this commit + workflow run; requires the id-token: write permission above.
      - name: Publish to npm
        run: npm publish ./lib --access=public --provenance

      # Generate a CycloneDX SBOM and attach it to the GitHub release so
      # consumers can audit the dependency set of each version (QA-02.02).
      - name: Generate and attach SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: ppu-ocv-sbom.cyclonedx.json
          output-file: ppu-ocv-sbom.cyclonedx.json
          upload-release-assets: true

      # Pack the exact published tarball so it can be signed and attached to the
      # GitHub release. OpenSSF Scorecard's Signed-Releases check reads release
      # assets for a signature/provenance file (npm provenance is not visible to
      # it), so we attach a cosign signature + Fulcio certificate per release.
      - name: Pack published tarball
        run: npm pack ./lib --pack-destination "$RUNNER_TEMP"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing via OIDC (Sigstore/Fulcio) — no long-lived keys; uses the
      # id-token: write permission. cosign 3.x emits a single Sigstore bundle
      # (.sigstore.json) holding the signature, Fulcio cert, and Rekor entry;
      # Scorecard's Signed-Releases check recognizes the .sigstore.json suffix.
      - name: Sign the tarball (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          for f in "$RUNNER_TEMP"/*.tgz; do
            cosign sign-blob "$f" --bundle "$f.sigstore.json"
          done

      - name: Attach signed artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "$RUNNER_TEMP"/*.tgz "$RUNNER_TEMP"/*.tgz.sigstore.json \
            --repo "${{ github.repository }}"
